<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" fill="none">
  <defs>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(200,191,168,0.14)"/>
      <stop offset="40%" stop-color="rgba(200,191,168,0.11)"/>
      <stop offset="80%" stop-color="rgba(242,240,233,0.06)"/>
      <stop offset="100%" stop-color="rgba(242,240,233,0.01)"/>
    </linearGradient>
  </defs>
  <!-- Heavy Power Trunk Line with Champagne Tone -->
  <path d="M 0 160 H 320 L 410 250 H 780 L 840 310 H 1020" stroke="url(#busGrad)" stroke-width="2.2" fill="none"/>
  <circle cx="1020" cy="310" r="5" fill="none" stroke="rgba(200,191,168,0.18)" stroke-width="1.2"/>
  <circle cx="1020" cy="310" r="2.2" fill="rgba(200,191,168,0.22)"/>
  <!-- 4-Track Synchronized Parallel Bus -->
  <path d="M 0 60 H 220.0 L 310.0 150.0 H 640.0" stroke="rgba(242,240,233,0.08)" stroke-width="1.4" fill="none"/>
  <circle cx="640.0" cy="150.0" r="3" fill="none" stroke="rgba(242,240,233,0.12)" stroke-width="0.9"/>
  <circle cx="640.0" cy="150.0" r="1.3" fill="rgba(242,240,233,0.16)"/>
  <path d="M 0 72 H 229.6 L 319.6 162.0 H 808.0" stroke="rgba(242,240,233,0.05)" stroke-width="0.9" fill="none"/>
  <circle cx="808.0" cy="162.0" r="3" fill="none" stroke="rgba(242,240,233,0.08)" stroke-width="0.9"/>
  <circle cx="808.0" cy="162.0" r="1.3" fill="rgba(242,240,233,0.10)"/>
  <path d="M 0 84 H 239.2 L 329.2 174.0 H 976.0" stroke="rgba(242,240,233,0.03)" stroke-width="0.9" fill="none"/>
  <circle cx="976.0" cy="174.0" r="3" fill="none" stroke="rgba(242,240,233,0.04)" stroke-width="0.9"/>
  <circle cx="976.0" cy="174.0" r="1.3" fill="rgba(242,240,233,0.06)"/>
  <path d="M 0 96 H 248.8 L 338.8 186.0 H 1144.0" stroke="rgba(242,240,233,0.03)" stroke-width="0.9" fill="none"/>
  <circle cx="1144.0" cy="186.0" r="3" fill="none" stroke="rgba(242,240,233,0.04)" stroke-width="0.9"/>
  <circle cx="1144.0" cy="186.0" r="1.3" fill="rgba(242,240,233,0.06)"/>
  <!-- Vertical Ingress Clock Line -->
  <path d="M 280 0 V 110 L 320 150 V 420 L 360 460 H 620" stroke="rgba(242,240,233,0.06)" stroke-width="1.2" fill="none"/>
  <circle cx="620" cy="460" r="3.2" fill="none" stroke="rgba(242,240,233,0.12)" stroke-width="1"/>
  <circle cx="620" cy="460" r="1.4" fill="rgba(242,240,233,0.14)"/>
  <!-- Mid-Tier Branching Trace -->
  <path d="M 0 340 H 140 L 210 410 H 460 L 500 450 V 620 L 530 650 H 740" stroke="rgba(242,240,233,0.04)" stroke-width="1.0" fill="none"/>
  <circle cx="740" cy="650" r="2.8" fill="none" stroke="rgba(242,240,233,0.10)" stroke-width="0.9"/>
  <!-- Lower Ground Bus -->
  <path d="M 0 540 H 90 L 140 590 H 340 L 380 630 H 520" stroke="rgba(242,240,233,0.03)" stroke-width="0.9" fill="none"/>
  <circle cx="520" cy="630" r="2.2" fill="rgba(242,240,233,0.06)"/>
  <!-- Microcontroller U1 Outline -->
  <rect x="680" y="210" width="64" height="64" fill="rgba(200,191,168,0.01)" stroke="rgba(242,240,233,0.06)" stroke-width="1" rx="2"/>
  <circle cx="688" cy="218" r="2" fill="rgba(200,191,168,0.18)"/>
  <text x="696" y="248" fill="rgba(242,240,233,0.08)" font-family="ui-monospace, monospace" font-size="8" letter-spacing="1">U1.CORE</text>
  <!-- Minimal Editorial Text Labels -->
  <text x="20" y="48" fill="rgba(242,240,233,0.07)" font-family="ui-monospace, monospace" font-size="8" letter-spacing="1.2">DATA_BUS [0:3] // 100_OHM</text>
  <text x="20" y="148" fill="rgba(200,191,168,0.11)" font-family="ui-monospace, monospace" font-size="8" letter-spacing="1.2">PWR_TRUNK // +3.3V_SYS</text>
  <text x="380" y="452" fill="rgba(242,240,233,0.06)" font-family="ui-monospace, monospace" font-size="7.5" letter-spacing="1">CLK.REF // 120MHz</text>
  <text x="20" y="930" fill="rgba(242,240,233,0.06)" font-family="ui-monospace, monospace" font-size="7.5" letter-spacing="1.5">SYS.ARCHITECTURE // MONO.01 // JIIT-128</text>
</svg>