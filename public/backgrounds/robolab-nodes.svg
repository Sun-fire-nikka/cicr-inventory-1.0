<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 550" fill="none">
  <!-- Concentric Orbital Telemetry Rings -->
  <circle cx="275" cy="275" r="230" stroke="rgba(121, 86, 232, 0.20)" stroke-width="1.5" stroke-dasharray="10 8" fill="none"/>
  <circle cx="275" cy="275" r="170" stroke="rgba(77, 191, 208, 0.25)" stroke-width="1.4" fill="none"/>
  <circle cx="275" cy="275" r="110" stroke="rgba(121, 86, 232, 0.25)" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
  <circle cx="275" cy="275" r="50" stroke="rgba(77, 191, 208, 0.35)" stroke-width="1.5" fill="none"/>

  <!-- Radar Crosshairs -->
  <line x1="275" y1="20" x2="275" y2="530" stroke="rgba(121, 86, 232, 0.16)" stroke-width="1" stroke-dasharray="6 6"/>
  <line x1="20" y1="275" x2="530" y2="275" stroke="rgba(121, 86, 232, 0.16)" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- Orbit Nodes with Pulse Rings -->
  <!-- Node 1: Top Orbit -->
  <circle cx="275" cy="45" r="8" fill="#4DBFD0" fill-opacity="0.7"/>
  <circle cx="275" cy="45" r="16" stroke="#4DBFD0" stroke-width="1.4" stroke-opacity="0.35" fill="none"/>
  <text x="295" y="49" fill="rgba(77, 191, 208, 0.65)" font-family="ui-monospace, monospace" font-size="9" font-weight="700">NODE.LIDAR_R1</text>

  <!-- Node 2: Right Orbit -->
  <circle cx="445" cy="275" r="7" fill="#8B65EE" fill-opacity="0.7"/>
  <circle cx="445" cy="275" r="14" stroke="#8B65EE" stroke-width="1.2" stroke-opacity="0.35" fill="none"/>
  <text x="445" y="305" fill="rgba(121, 86, 232, 0.65)" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">NODE.IMU_6DOF</text>

  <!-- Node 3: Bottom Left Orbit -->
  <circle cx="155" cy="395" r="6" fill="#E9C557" fill-opacity="0.8"/>
  <circle cx="155" cy="395" r="13" stroke="#E9C557" stroke-width="1.2" stroke-opacity="0.4" fill="none"/>
  <text x="175" y="415" fill="rgba(233, 197, 87, 0.75)" font-family="ui-monospace, monospace" font-size="8.5">NODE.SONAR_02</text>

  <!-- Center Datum Anchor -->
  <circle cx="275" cy="275" r="8" fill="#282352" stroke="#8B65EE" stroke-width="2"/>
  <circle cx="275" cy="275" r="3" fill="#4DBFD0"/>
</svg>