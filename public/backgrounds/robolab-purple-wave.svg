<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" fill="none">
  <defs>
    <!-- Primary rich purple gradient -->
    <linearGradient id="purpleGradPrimary" x1="0%" y1="0%" x2="70%" y2="80%">
      <stop offset="0%" stop-color="#7956E8" stop-opacity="0.38"/>
      <stop offset="35%" stop-color="#8B65EE" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#A47BF2" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ECEAF4" stop-opacity="0"/>
    </linearGradient>

    <!-- Secondary soft lavender gradient -->
    <linearGradient id="purpleGradSecondary" x1="20%" y1="0%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#B69AF4" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#8B65EE" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F2F0F6" stop-opacity="0"/>
    </linearGradient>

    <!-- Cyan-tinted atmosphere blend -->
    <radialGradient id="cyanAtmosphere" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#4DBFD0" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#7956E8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ECEAF4" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom-right subtle balancing wave -->
    <linearGradient id="bottomRightGrad" x1="100%" y1="100%" x2="30%" y2="40%">
      <stop offset="0%" stop-color="#A47BF2" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#B69AF4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F2F0F6" stop-opacity="0"/>
    </linearGradient>

    <!-- Smooth organic blur filter -->
    <filter id="softGlowBlur" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <!-- Large organic purple/lavender abstract region entering from top-left across upper-center -->
  <!-- Layer 1: Broad atmospheric aura -->
  <path d="M -120 -80 
           Q 350 -60 620 90 
           T 1050 210 
           Q 1250 320 1180 520 
           T 780 620 
           Q 460 680 180 540 
           T -120 420 Z" 
        fill="url(#purpleGradPrimary)" filter="url(#softGlowBlur)" />

  <!-- Layer 2: Defined organic curve wave -->
  <path d="M -80 -40
           C 280 -20, 520 80, 740 180
           C 960 280, 1140 260, 1080 430
           C 1020 600, 720 540, 500 500
           C 280 460, 90 530, -80 380 Z"
        fill="url(#purpleGradSecondary)" />

  <!-- Layer 3: Cyan-lit upper robotics glow zone -->
  <circle cx="280" cy="180" r="320" fill="url(#cyanAtmosphere)" filter="url(#softGlowBlur)" />

  <!-- Layer 4: Micro technical contour waves -->
  <path d="M -60 120 
           C 300 130, 540 220, 760 310
           S 1020 380, 1120 460"
        stroke="rgba(139, 101, 238, 0.22)" stroke-width="1.8" stroke-dasharray="8 6" fill="none"/>

  <path d="M -60 180 
           C 320 200, 580 290, 800 370
           S 1040 430, 1150 510"
        stroke="rgba(77, 191, 208, 0.18)" stroke-width="1.4" fill="none"/>

  <!-- Layer 5: Bottom right balancing wave -->
  <path d="M 1680 1180
           Q 1350 1150 1150 980
           T 920 780
           Q 1120 640 1380 680
           T 1680 760 Z"
        fill="url(#bottomRightGrad)" filter="url(#softGlowBlur)"/>
</svg>